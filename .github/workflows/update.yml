name: Aggiorna dati ARPA e pubblica

on:
  schedule:
    - cron: '30 5 * * *'   # ogni giorno alle 05:30 UTC (07:30 ora italiana estiva)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aria-pavia-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica e aggrega i dati ARPA (anno corrente + precedente, più gli anni chiusi mancanti)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python scripts/fetch_arpa.py --years current,previous

      - name: Costruisci site/data.js
        run: python scripts/build_data.py

      # Solo gli anni chiusi (<= anno corrente - 2) vivono nel repository: cambiano al massimo una volta l'anno,
      # a gennaio, quando un anno "matura". Anno corrente e precedente stanno in data/open/ (ignorato da git):
      # vengono riscaricati ogni notte e finiscono direttamente nel sito, senza far crescere la storia git.
      - name: Committa gli anni chiusi appena maturati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Nessun nuovo anno chiuso da committare."
          else
            git commit -m "Archivia anno chiuso ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
